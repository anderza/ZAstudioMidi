name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 24.04 images ship the Android SDK (ANDROID_HOME) preinstalled
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - name: Build player page
        run: python3 web/build.py

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > app/release.jks; echo "fixed key"; else echo "no KEYSTORE_B64 secret: debug key, updates will not install over older builds"; fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/MidiDrums.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MidiDrums-apk
          path: out/MidiDrums.apk

      # a release per build gives a direct download link that opens on a phone
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ZaDrumsMidi, сборка ${{ github.run_number }}
          files: out/MidiDrums.apk
          make_latest: true
