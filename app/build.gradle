plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anderza.mididrums'
    compileSdk 34

    defaultConfig {
        applicationId 'com.anderza.mididrums'
        minSdk 24
        targetSdk 34
        // every CI build gets a higher number so Android installs it as an update
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger() + 100)
        versionName('1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0'))
    }

    // One fixed key for every build: Android only accepts an update signed with the same key as the installed app.
    // The key lives in app/release.jks (kept in the repository at the owner's request); KEYSTORE_* secrets override it.
    def ksPass = System.getenv('KEYSTORE_PASSWORD') ?: 'e9ce5667772bbc3ef0b387b3'
    def hasKey = file('release.jks').exists() && !ksPass.isEmpty()
    if (hasKey) {
        signingConfigs {
            release {
                storeFile file('release.jks')
                storePassword ksPass
                keyAlias 'mididrums'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig(hasKey ? signingConfigs.getByName('release') : signingConfigs.getByName('debug'))
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // the player page embeds its drum samples; keep it uncompressed-friendly and never strip it
    androidResources { noCompress 'html' }
}
